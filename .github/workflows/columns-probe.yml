# 一次性探活（验证后删除）：金十 50 条 + 双栏目真实采集 + 整份简报端到端 dry-run
name: 一次性探活 · 50 条与双栏目

on:
  push:
    branches: [arena/52310289-273]
    paths:
      - probe_columns.py
      - .github/workflows/columns-probe.yml

permissions:
  contents: write

concurrency:
  group: columns-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 金十 50 与双栏目真实采集
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python probe_columns.py

      - name: 整份市场简报端到端 dry-run（规则模式，不推送）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p probe_out
          start=$SECONDS
          set +e
          python pushplus_deepseek.py --template feedscan --topic 全球市场早报 \
            --channel pushplus --ai-provider rule --theme dos --hours 24 \
            --no-chart --no-ai-compress --timeout 45 --dry-run > probe_out/e2e_full.txt 2>&1
          code=$?
          echo "{\"exit_code\": $code, \"elapsed_s\": $((SECONDS - start))}" > probe_out/e2e_meta.txt
          grep -o "金十数据（[0-9]*／*5*0*）*[^ ]*" probe_out/e2e_full.txt | head -c 300 > probe_out/e2e_jin10_head.txt || true
          grep -o "金十数据[^（]*（[0-9]*/[0-9]*）" probe_out/e2e_full.txt | head -3 >> probe_out/e2e_jin10_head.txt || true
          grep -c "flash.jin10" probe_out/e2e_full.txt > probe_out/e2e_jin10_links.txt || true
          grep -c "香港券商新闻与数据\|香港证券公司新闻与数据" probe_out/e2e_full.txt > probe_out/e2e_hk_marks.txt || true
          grep -c "国外投行研报" probe_out/e2e_full.txt > probe_out/e2e_fw_marks.txt || true
          tail -n 120 probe_out/e2e_full.txt > probe_out/e2e_tail.txt
          wc -c probe_out/e2e_full.txt > probe_out/e2e_size.txt
          rm -f probe_out/e2e_full.txt
          exit 0

      - name: 回写探活结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe_out/
          if git diff --cached --quiet; then echo "无结果可写"; exit 0; fi
          git commit -m "chore: 50条与双栏目线上探活结果"
          git push origin HEAD
