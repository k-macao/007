# ============================================================================
# CI —— 离线自检门禁（push / pull_request 自动触发）
#
# 为什么需要它：本仓库另外三个 workflow（market-brief / stock-report /
# broker-columns）全部是 workflow_dispatch 或 schedule 触发，也就是说
# **代码合并进 main 之前没有任何自动校验**；`--selftest` 与 `test_*.py`
# 只能靠人手动跑。这条 workflow 把它们变成门禁：改坏解析器、模板、
# 栏目或语法，PR 上直接红。
#
# 设计约束（与仓库既有 workflow 保持一致）：
#   · 纯离线、零第三方依赖：本仓库无 requirements.txt/pyproject.toml，
#     因此**不要**给 setup-python 加 `cache: 'pip'`（会导致该步骤失败）；
#   · 零 Secret：AI Key 在 job 级与 step 级双保险置空，自检结果与仓库
#     是否配置 DEEPSEEK_API_KEY / OPENAI_API_KEY 完全无关；
#   · action 一律 pin 到 commit SHA（防 tag 解析抖动），保留 tag 注释便于阅读；
#   · 最小权限 `contents: read`、`timeout-minutes: 15`、concurrency 防并发。
#
# 覆盖范围：
#   ① 全部 .py 字节编译（含 server_dashboard.py / pushplus_deepseek.py 等超大模块）
#   ② unittest 发现并运行 test_*.py（推理 API / HF 双协议 + 港股行情离线解析
#      + hf_hub 对接层：目录 / 词典 / datasets-server / 情绪引擎）
#   ③ 13 个模块的 --selftest（推理 API + 解析器 + 模板 + 栏目 + 推送降级 + HF Hub）
#
# 有意排除：`hk_quote.py --selftest` 是**联网数据源打分基准**（三源真抓取后
# 输出成功率/耗时表），全部源失败时依然 exit 0，不能当断言门禁用；
# hk_quote 的离线覆盖由 test_hk_quote.py（内置真实抓包样本）承担。
# ============================================================================
name: CI - Offline Gate (离线自检门禁)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      probe_hf:
        description: '额外跑一次 Hugging Face 探活（需外网；只打印脱敏结果，不打印明文 Key）'
        required: false
        default: false
        type: boolean
      require_token:
        description: 'HF 探活的硬判定：勾选后 HF_TOKEN 缺失即判失败（用于核查仓库到底配没配）'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # 只对 PR 取消旧运行（推 main 的每次运行都要留档）
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-gate:
    name: Offline tests & selftests (离线测试与自检)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: '1'
      # 自检必须「真离线」：屏蔽 AI Key，避免联网压缩导致
      # 「无 Key 时优雅跳过（正文完整）」这类断言误判。
      DEEPSEEK_API_KEY: ''
      OPENAI_API_KEY: ''
      OPENAI_BASE_URL: ''
      HF_TOKEN: ''
      HUGGINGFACE_API_KEY: ''
      HUGGINGFACEHUB_API_TOKEN: ''
      INFERENCE_API_KEY: ''
      INFERENCE_PROVIDER: ''
      INFERENCE_BASE_URL: ''
      SENTIMENT_ENGINE: ''

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          # 不加 cache: 'pip' —— 本仓库无依赖清单，加了会让本步骤失败

      - name: Show runtime (不打印任何 Secret)
        run: |
          python -V
          python -c "import sys; print(sys.executable)"
          echo "DEEPSEEK_API_KEY len=${#DEEPSEEK_API_KEY} OPENAI_API_KEY len=${#OPENAI_API_KEY}"

      - name: Byte-compile all Python sources (语法门禁)
        run: python -m compileall -q .

      - name: Unit tests (unittest discover test_*.py)
        run: python -m unittest discover -s . -p "test_*.py" -v

      - name: Module selftests (14 个模块 --selftest，离线)
        shell: bash
        run: |
          MODULES="
            source_names
            inference_api
            deepseek_search
            equity_research_column
            foreign_institution_weekly
            hf_hub
            hk_brokers
            newsnow_sources
            pushplus_deepseek
            skills_hub
            source_check_db
            stock_news_scan
            stock_report
            us_quote
          "
          fail=0
          for m in $MODULES; do
            echo "::group::--selftest · ${m}.py"
            # 逐个跑完再汇总：一个模块坏掉时，其余模块的结果同样有诊断价值
            if python "${m}.py" --selftest; then
              echo "✅ ${m}.py 自检通过"
            else
              echo "❌ ${m}.py 自检失败（exit=$?）"
              fail=1
            fi
            echo "::endgroup::"
          done
          if [[ "$fail" -ne 0 ]]; then
            echo "::error::离线自检门禁未通过：至少一个模块 --selftest 返回非 0"
            exit 1
          fi
          echo "✅ 全部 14 个模块自检通过"

  # ==========================================================================
  # 🤗 Hugging Face 探活（仅 workflow_dispatch 且勾选 probe_hf 时运行）
  #
  # 为什么单独开一个 job：上面的离线门禁是**零网络**的，永远测不出
  # 「HF_TOKEN 配没配、配了能不能用」。这一 job 只在手动勾选时跑，用真实外网回答：
  #   ① 仓库里有没有 HF_TOKEN（只打印「已配置 + 长度」，不打印明文，也不打印片段）
  #   ② Hub 检索 / datasets-server 取数通不通（公开数据，不需要 Key）
  #   ③ 有 Key 时，FinBERT / 中文 tone 模型能不能真跑起来（engine=hf 强制走模型）
  #
  # 判定口径（三件事必须分开看，别混成一句「Token 有问题」）：
  #   · **没配** → secrets 为空，① 打印「未配置」，模型调用整段跳过；这是合法状态，
  #     情绪引擎 auto 会降级到 llm（有 Key 时）或本地词典，推送照常出。
  #   · **配了但无效** → ① 有长度，③ 返回 401/403（kind=auth）。
  #   · **配了但没额度** → ③ 返回 402（kind=payment，`no remaining credits`）。
  #     402 不是 Key 错，auto 引擎会据此降级；本仓库 2026-10-22 曾实测到这一种。
  #   （上述实测是在当时的**本地环境变量**上做的，不代表仓库 Secret 现在仍然存在；
  #     要确认仓库侧，勾上 require_token 跑一次，缺失即红。）
  #
  # 写法上的三个刻意选择（避免 GitHub 校验失败）：
  #   · job 级 if 用 github.event.inputs，不用 inputs 上下文；
  #   · 不把 secrets 写进 if 条件，改为在 shell 里判断环境变量是否为空；
  #   · 只有显式勾选 require_token 才把「缺失」判成失败，默认探活永远绿（诊断用）。
  # ==========================================================================
  hf-probe:
    name: HF Token probe (手动勾选 probe_hf 才跑)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.probe_hf == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    env:
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Token verdict (配没配 · 可选硬判定)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REQUIRE_TOKEN: ${{ github.event.inputs.require_token }}
        run: |
          # 只回答「仓库有没有配」这一个问题，不做网络请求，几秒内出结论。
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN：未配置（长度 0）"
            echo "- 影响面：Hub 检索 / datasets-server 取数照常（公开数据免 Key）；"
            echo "  情绪引擎 auto 会按 hf → llm → lexicon 顺序降级，推送不受影响。"
            echo "- 想启用 FinBERT：仓库 Settings → Secrets and variables → Actions →"
            echo "  新建 HF_TOKEN（只需 Read + Inference Providers 权限，且账户要有推理额度）。"
            if [ "$REQUIRE_TOKEN" = "true" ]; then
              echo "::error::require_token=true 且 HF_TOKEN 缺失 → 判失败（本次就是「未配置」的实证）"
              exit 1
            fi
          else
            # 不打印任何明文/片段，只报长度，避免 Key 从日志外泄。
            echo "HF_TOKEN：已配置（长度 ${#HF_TOKEN}）"
          fi

      - name: Probe Hub + datasets-server + model (不打印明文 Key)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            echo "HF_TOKEN：已配置（长度 ${#HF_TOKEN}）"
          else
            echo "HF_TOKEN：未配置（公开数据集仍可用；模型调用会降级为本地词典）"
          fi
          echo ""
          echo "—— ① 连通性：Hub / datasets-server / 模型推理 ——"
          python hf_hub.py --check || echo "（上面有失败项，见 kind 分类）"
          echo ""
          if [ -n "$HF_TOKEN" ]; then
            echo "—— ② 强制 engine=hf：能出 JSON 说明 Token 有效且模型可调用 ——"
            python hf_hub.py --sentiment "Revenue surges 38% year over year, beats estimates" \
                             --engine hf --json || echo "❌ 英文 FinBERT 调用失败"
            echo "—— ③ 中文 tone 模型 ——"
            python hf_hub.py --sentiment "公司三季度净利润同比增长 42%，大幅超市场预期" \
                             --engine hf --model yiyanghkust/finbert-tone-chinese --json \
                             || echo "❌ 中文 tone 模型调用失败（可能未在 Inference Providers 上架）"
          else
            echo "⏭ 未配置 HF_TOKEN，跳过模型调用（上面 --check 已验证公开端点）"
          fi

      - name: Write job summary
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          {
            echo "## 🤗 Hugging Face 探活结果"
            echo ""
            echo "- 分支：\`${{ github.ref_name }}\` · 提交 \`${GITHUB_SHA::7}\`"
            if [ -n "$HF_TOKEN" ]; then
              echo "- HF_TOKEN：✅ 已配置（长度 ${#HF_TOKEN}）"
            else
              echo "- HF_TOKEN：⚪️ 未配置（可选；公开数据集可用，模型调用降级为 llm / 本地词典）"
            fi
            echo ""
            echo "判定口径：\`--check\` 里前四项全绿 = Hub + datasets-server 通；"
            echo "模型调用能出 JSON = Token 有效且**有推理额度**（402 = 额度用尽，不是 Key 错）。"
          } >> "$GITHUB_STEP_SUMMARY"
