# 一次性线上探活（验证后删除）：随 push 触发，在真实网络验证修复后的
# 9 个快讯端点，并把结果作为提交推回本分支供检视。
name: Probe Fixed Feeds (temp)

on:
  push:
    branches:
      - arena/52310289-273
    paths:
      - .github/workflows/probe-feeds.yml
      - probe_feeds.py

permissions:
  contents: write

concurrency:
  group: probe-feeds
  cancel-in-progress: false

jobs:
  probe:
    name: Probe fixed feeds live
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Run probe
        env:
          PYTHONUNBUFFERED: '1'
        run: python probe_feeds.py

      - name: Commit probe results back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe_out
          git commit -m "probe: 9 源线上探活结果（一次性，验证后删除）" || echo "nothing to commit"
          git push origin HEAD:arena/52310289-273
