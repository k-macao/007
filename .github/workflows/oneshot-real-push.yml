# 一次性临时工作流（用后即删）：因 Arena 沙箱令牌无 workflow_dispatch 权限，
# 借 push 触发重发一次真实推送。参数与 stock-report.yml 手动运行默认一致，
# 唯一区别：等同 dry_run=false（带 --push 真实推送到微信）。
name: One-shot Real Push (temp)

on:
  push:
    branches:
      - arena/52310289-273
    paths:
      - .github/workflows/oneshot-real-push.yml

permissions:
  contents: read

concurrency:
  group: oneshot-real-push
  cancel-in-progress: false

jobs:
  report:
    name: Generate & Push Stock Report (one-shot)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      WECOM_KEY: ${{ secrets.WECOM_KEY }}
      SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Restore push state (新鲜度看板跨运行对比)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: output/push_state.json
          key: push-state-${{ github.run_id }}
          restore-keys: |
            push-state-

      - name: Offline selftest (离线自检 · 屏蔽 AI Key)
        env:
          DEEPSEEK_API_KEY: ''
          OPENAI_API_KEY: ''
        run: python stock_report.py --selftest

      - name: Check secrets (只检查配置，不发送)
        continue-on-error: true
        run: |
          python stock_report.py --check-only \
            --channel "pushplus" \
            --ai-provider "auto"

      # 与 stock-report.yml 的「Real push」步骤同一条命令（code=09988 默认），
      # 额外把输出 tee 到文件并做结果校验：被优雅跳过时让运行标红，避免假成功。
      - name: Real push (真实推送到微信 · 一次性)
        shell: bash
        run: |
          set -o pipefail
          python stock_report.py "09988" \
            --channel "pushplus" \
            --ai-provider "auto" \
            --template "equity" \
            --mode "full" \
            --industry "" \
            --risk "mid" \
            --theme "dos" \
            --hours "48" \
            --push | tee push-output.log
          echo "===== 推送结果校验 ====="
          if ! grep -q "dry_run=False" push-output.log; then
            echo "::error::未检测到 dry_run=False，本次不是真实推送"
            exit 1
          fi
          if grep -q "跳过：缺少 Secret" push-output.log; then
            echo "::error::推送通道因缺少 Secret 被跳过，微信不会收到"
            exit 1
          fi
          if ! grep -q "✅ pushplus: 发送成功" push-output.log; then
            echo "::error::未检测到 pushplus 发送成功标记，请查上方推送结果"
            exit 1
          fi
          echo "✅ 已真实推送到微信（pushplus 发送成功）"
          {
            echo "## ✅ 一次性真实推送完成"
            echo ""
            echo "- 股票代码：09988（默认）· 模板：equity · 通道：pushplus · 主题：dos"
            echo "- dry_run=False，pushplus 返回发送成功，请到微信查收。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save push state (供下次新鲜度对比)
        if: ${{ success() && hashFiles('output/push_state.json') != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: output/push_state.json
          key: push-state-${{ github.run_id }}
