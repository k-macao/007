# 每日全市场快讯简报：仅推送市场/板块扫描，不调用个股研报或个股行情页。
# GitHub Actions cron 使用 UTC；澳门/香港为 UTC+8，故 cron 01:00=本地 09:00
# （盘前早报）、09:00=本地 17:00（收市晚报）。（2026-10 起按澳门时间 09/17 点；
# 此前 UTC 09/17 实际是澳门 17:00 与次日凌晨 01:00，标注有误，一并修正。）
# 简报正文后自动并入「香港券商新闻与数据」+「国外投行研报标题」两节
# （pushplus_deepseek feedscan 的市场简报栏目，BRIEF_COLUMNS=0 可关闭）。
name: Scheduled Market Brief (DOS Monitor)

on:
  schedule:
    - cron: '0 1 * * *' # 每日 UTC 01:00 = 澳门/香港 09:00（早报）
    - cron: '0 9 * * *' # 每日 UTC 09:00 = 澳门/香港 17:00（晚报）
  workflow_dispatch:
    inputs:
      dry_run:
        description: '手动试跑默认仅预览；设为 false 才真实推送。定时任务始终真实推送。'
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: market-brief-${{ github.ref }}
  cancel-in-progress: false

jobs:
  market-brief:
    name: Generate & Push Market-wide Brief
    runs-on: ubuntu-latest
    # 简报含香港券商+国外投行两栏目的逐家检索，较此前留足余量
    timeout-minutes: 25

    env:
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      # 情绪复核（pushplus_deepseek → hf_hub，engine=auto）优先用 HF 金融模型；
      # 不配也能跑（降级 llm → 本地词典），配了就自动切 FinBERT。见 HUGGINGFACE.md §7.5。
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      # 可选：强制情绪引擎（auto / llm / lexicon / hf），留空=auto；仓库变量同名可配。
      SENTIMENT_ENGINE: ${{ vars.SENTIMENT_ENGINE }}
      PUSH_STATE_PATH: output/market_push_state.json
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Report sentiment engine state (不打印明文)
        run: |
          python - <<'PY'
          import os
          import hf_hub as hh

          token = os.environ.get("HF_TOKEN", "")
          print(f"HF_TOKEN：{'已配置（长度 ' + str(len(token)) + '）' if token else '未配置（可选）'}")
          print(f"情绪引擎：请求 {os.environ.get('SENTIMENT_ENGINE') or 'auto'}"
                f" · 大模型端点 {'可用' if hh.llm_available() else '未配置'}"
                f" · auto 顺序 hf → llm → lexicon")
          PY

      - name: Restore market push state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: output/market_push_state.json
          key: market-push-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            market-push-state-

      - name: Resolve bulletin session
        id: session
        shell: bash
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          case "$SCHEDULE_CRON" in
            '0 1 * * *') echo 'topic=全球市场早报' >> "$GITHUB_OUTPUT" ;; # 澳门 09:00
            '0 9 * * *') echo 'topic=全球市场晚报' >> "$GITHUB_OUTPUT" ;; # 澳门 17:00
            *) echo 'topic=全球市场简报' >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Generate and push market-only brief
        shell: bash
        env:
          REPORT_TOPIC: ${{ steps.session.outputs.topic }}
          RUN_EVENT: ${{ github.event_name }}
          MANUAL_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$RUN_EVENT" == "schedule" || "$MANUAL_DRY_RUN" == "false" ]]; then
            if [[ -z "$PUSHPLUS_TOKEN" ]]; then
              echo '::error::PUSHPLUS_TOKEN is required for automatic market pushes.'
              exit 1
            fi
            python pushplus_deepseek.py \
              --template feedscan \
              --topic "$REPORT_TOPIC" \
              --channel pushplus \
              --ai-provider deepseek \
              --theme dos \
              --hours 24 \
              --no-chart \
              --no-ai-compress \
              --timeout 45
          else
            python pushplus_deepseek.py \
              --template feedscan \
              --topic "$REPORT_TOPIC" \
              --channel pushplus \
              --ai-provider deepseek \
              --theme dos \
              --hours 24 \
              --no-chart \
              --no-ai-compress \
              --timeout 45 \
              --dry-run
          fi

      - name: Save market push state
        if: ${{ success() && hashFiles('output/market_push_state.json') != '' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: output/market_push_state.json
          key: market-push-state-${{ github.run_id }}-${{ github.run_attempt }}
